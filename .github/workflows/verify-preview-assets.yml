name: Verify Wings Over L.A. preview assets and lead endpoint

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser and Worker syntax
        run: |
          node --check app.js
          node --check functions/api/lead.js
      - name: Test lead handling and verify media/fleet references
        run: npm test
